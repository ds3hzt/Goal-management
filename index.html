<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>목표 관리</title><meta name="theme-color" content="#1769df"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#17212b}header{background:#fff;padding:12px 10px;font-size:21px;font-weight:750;display:flex;justify-content:space-between;align-items:center}button{cursor:pointer;border:0;border-radius:8px;padding:9px 12px;background:#1769df;color:white;font-weight:650}main{padding:7px;overflow-x:hidden}.wrap{background:white;border-radius:10px;overflow:hidden}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{border-bottom:1px solid #e1e5eb;padding:7px 2px;text-align:center;overflow-wrap:anywhere;font-size:clamp(13px,3.45vw,17px)}th:nth-child(1){width:20%}th:nth-child(2){width:9%}th:nth-child(3){width:24%}th:nth-child(4){width:36%}th:nth-child(5){width:11%}th{background:#edf2fa}td.goal{text-align:left;word-break:break-word}.small{font-size:14px;color:#657282}.bar{height:9px;border-radius:8px;background:#e5e9ef;overflow:hidden;flex:1;min-width:0}.fill{height:100%;background:#2b78d6}.fill.done{background:#20a47b}.metric{text-align:left;display:grid;gap:7px}.metric-line{display:flex;align-items:center;gap:4px;flex-wrap:nowrap}.metric-line .bar{flex:1 1 auto;width:0;height:10px}.metric{gap:6px}.metric-label{font-size:clamp(12px,3.1vw,15px);white-space:nowrap;min-width:0;font-weight:650}.detail-btn{font-size:clamp(12px,3.1vw,15px);padding:10px 1px;width:100%;line-height:1.2}.date-cell{font-size:clamp(12px,3.1vw,15px);line-height:1.45;white-space:nowrap}@media(max-width:390px){th,td{padding:7px 1px}.metric-label{font-size:12px}.detail-btn{font-size:12px;padding:9px 1px}.date-cell{font-size:12px}header button{font-size:15px;padding:10px 8px}}dialog{border:0;border-radius:14px;padding:20px;width:min(92vw,650px);box-sizing:border-box;max-height:88vh}dialog::backdrop{background:#0008}label{display:block;margin:12px 0 4px;font-weight:600}input{padding:10px;border:1px solid #cdd5e0;border-radius:7px;box-sizing:border-box;width:100%}.actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}.muted{background:#e8ecf2;color:#263442}.danger{background:#c94b4b}.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(83px,1fr));gap:7px;margin-top:14px}.cell{background:#f0f3f7;color:#354052;border:1px solid #d7dfe8;min-height:55px;padding:5px;font-size:15px}.cell.checked{background:#d8f3e9;border-color:#46b88a;color:#146b4c}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}h2{margin:0;font-size:20px}#empty{padding:30px;text-align:center;color:#667}footer{padding:8px;font-size:12px;color:#667}.install-tip{background:#eaf2ff;border-radius:9px;padding:12px;margin:8px 0;font-size:15px;line-height:1.55}.install-tip button{font-size:15px;margin-top:6px}.date-cell{white-space:normal;overflow-wrap:normal;word-break:keep-all}header{font-size:25px}header button{font-size:16px}th{font-weight:750}td.goal{font-weight:600}/* 2-line status: label + bar on the same line */
.metric-line{min-width:0;width:100%;height:20px;overflow:hidden}.metric-label{flex:0 0 59px;text-align:left;font-size:clamp(11px,2.9vw,14px);letter-spacing:-.5px}.metric-line .bar{min-width:9px;max-width:none}.metric{gap:3px}.date-cell{font-size:clamp(11px,2.95vw,15px);line-height:1.35}.detail-btn{font-size:clamp(11px,2.95vw,15px);padding:8px 0}th,td{line-height:1.25}td.goal{font-size:clamp(13px,3.45vw,17px)}@media(max-width:390px){.metric-label{font-size:11px;flex-basis:52px}.date-cell{font-size:11px}.detail-btn{font-size:11px}}
</style></head><body><header>목표 관리 <button onclick="addGoal()">+ 목표 추가</button></header><main><div class="wrap"><table><thead><tr><th>목표</th><th>횟수</th><th>일정<br><span class="small">시작 / 기한</span></th><th>현황<br><span class="small">날짜 / 진행</span></th><th>상세</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" hidden>목표 추가 버튼을 눌러 첫 목표를 등록하세요.</div></div><footer>기록은 현재 브라우저에 저장됩니다.</footer></main><dialog id="editDialog"><h2 id="formTitle">목표 추가</h2><form id="goalForm"><label>목표 내용</label><input id="name" required maxlength="200"><label>목표 횟수</label><input id="count" type="number" min="1" max="10000" required value="100"><label>시작일</label><input id="start" type="date" required><label>기한일</label><input id="end" type="date" required><div class="actions"><button type="button" class="muted" onclick="editDialog.close()">취소</button><button type="submit">저장</button></div></form></dialog><dialog id="detailDialog"><div class="top"><h2 id="detailTitle"></h2><button class="muted" onclick="detailDialog.close()">닫기</button></div><p id="detailInfo" class="small"></p><div class="actions" style="justify-content:flex-start"><button class="muted" onclick="editCurrent()">목표 수정</button><button class="danger" onclick="removeCurrent()">목표 삭제</button></div><div id="cells" class="cells"></div></dialog><script>const KEY='goal-management-v1';let goals=[];try{goals=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}let editing=null,current=null;const $=id=>document.getElementById(id);const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const fmt=s=>s.replaceAll('-','.');const save=()=>{localStorage.setItem(KEY,JSON.stringify(goals));render()};function pct(g){let s=new Date(g.start+'T00:00:00').getTime(),e=new Date(g.end+'T00:00:00').getTime(),n=new Date(today()+'T00:00:00').getTime();return Math.round(Math.max(0,Math.min(100,(n-s)/(e-s||1)*100)))}function render(){let body=$('rows');body.replaceChildren();$('empty').hidden=goals.length!==0;goals.forEach(g=>{let tr=document.createElement('tr');let completed=g.dates.filter(Boolean).length,progress=Math.round(completed/g.count*100);let cells=[g.name,String(g.count),`${fmt(g.start)}<br>~ ${fmt(g.end)}`,`<div class="metric"><div class="metric-line"><span class="metric-label">날짜 ${pct(g)}%</span><div class="bar"><div class="fill" style="width:${pct(g)}%"></div></div></div><div class="metric-line"><span class="metric-label">진행 ${progress}%</span><div class="bar"><div class="fill done" style="width:${progress}%"></div></div></div></div>`];cells.forEach((value,i)=>{let td=document.createElement('td');if(i===0){td.className='goal';td.textContent=value}else if(i===2||i===3){td.innerHTML=value;if(i===2)td.className='date-cell';}else td.textContent=value;tr.appendChild(td)});let td=document.createElement('td'),btn=document.createElement('button');btn.textContent='상세';btn.className='detail-btn';btn.setAttribute('aria-label','상세 보기');btn.onclick=()=>showDetail(g.id);td.appendChild(btn);tr.appendChild(td);body.appendChild(tr)})}function addGoal(){editing=null;$('formTitle').textContent='목표 추가';$('goalForm').reset();$('count').value=100;$('start').value=today();$('end').value=today();$('editDialog').showModal()}$('goalForm').onsubmit=e=>{e.preventDefault();let name=$('name').value.trim(),count=Number($('count').value),start=$('start').value,end=$('end').value;if(!name||!Number.isInteger(count)||count<1||count>10000||end<start){alert('목표, 횟수 및 날짜를 확인해 주세요.');return}if(editing){let g=goals.find(x=>x.id===editing);Object.assign(g,{name,count,start,end});g.dates.length=count;g.dates=Array.from({length:count},(_,i)=>g.dates[i]||null)}else goals.push({id:crypto.randomUUID(),name,count,start,end,dates:Array(count).fill(null)});save();$('editDialog').close()};function showDetail(id){current=id;let g=goals.find(x=>x.id===id);if(!g)return;$('detailTitle').textContent=g.name;let completed=g.dates.filter(Boolean).length;$('detailInfo').textContent=`${fmt(g.start)} ~ ${fmt(g.end)} · 완료 ${completed}/${g.count}회`;let box=$('cells');box.replaceChildren();g.dates.forEach((date,i)=>{let b=document.createElement('button');b.className='cell'+(date?' checked':'');b.textContent=date?`${i+1}회 완료\n${fmt(date)}`:`${i+1}`;b.style.whiteSpace='pre-line';b.onclick=()=>{if(g.dates[i]){if(!confirm('이 완료 기록을 취소하시겠습니까?'))return;g.dates[i]=null}else g.dates[i]=today();save();showDetail(id)};box.appendChild(b)});$('detailDialog').showModal()}function editCurrent(){let g=goals.find(x=>x.id===current);if(!g)return;editing=g.id;$('formTitle').textContent='목표 수정';$('name').value=g.name;$('count').value=g.count;$('start').value=g.start;$('end').value=g.end;$('detailDialog').close();$('editDialog').showModal()}function removeCurrent(){if(!confirm('이 목표와 완료 기록을 모두 삭제하시겠습니까?'))return;goals=goals.filter(x=>x.id!==current);save();$('detailDialog').close()}render();if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
